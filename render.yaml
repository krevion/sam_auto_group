services:
  - type: web
    name: sam-auto-group
    runtime: python
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: gunicorn sam.wsgi:application --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: sam-auto-group
          property: host
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sam-auto-group.onrender.com
      - key: DATABASE_URL
        sync: false