services:
  - type: web
    name: sam-auto-group
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn sam.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: sam-auto-group
          property: host
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sam-auto-group.onrender.com
      - key: DATABASE_URL
        sync: false